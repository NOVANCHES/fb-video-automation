name: Publicación Automática Día, Tarde y Noche (Videos, Fotos y Textos)

on:
  schedule:
    # 1. DÍA: 9:00 AM hora Ciudad de México (15:00 UTC)
    - cron: '0 15 * * *'
    # 2. TARDE: 2:00 PM hora Ciudad de México (20:00 UTC)
    - cron: '0 20 * * *'
    # 3. NOCHE: 8:00 PM hora Ciudad de México (02:00 UTC)
    - cron: '0 2 * * *'

  # Control manual desde la app de GitHub en tu Xiaomi Redmi Note 10S
  workflow_dispatch:
    inputs:
      topic:
        description: 'Tema (deja "auto" para usar tendencias del momento)'
        required: false
        default: 'auto'
      format:
        description: 'Formato: "auto" (rota entre video, foto y texto), "video", "photo" o "text"'
        required: false
        default: 'auto'

permissions:
  contents: write

jobs:
  publicar-contenido-facebook:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (Gemini, Edge-TTS, MoviePy, Selenium)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar y publicar (Video con pregunta, Foto con historia o Texto de debate)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_EMAIL: ${{ secrets.FB_EMAIL }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
          FB_COOKIES_B64: ${{ secrets.FB_COOKIES_B64 }}
        run: |
          python main.py --topic "${{ github.event.inputs.topic || 'auto' }}" --format "${{ github.event.inputs.format || 'auto' }}" --headless

      - name: Guardar historial de temas y formatos publicados
        run: |
          git config user.name "FB Creator Bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/published_topics.json output/published_formats.json
          git diff --staged --quiet || (git commit -m "Actualizar historial de publicaciones (Día/Tarde/Noche)" && git push)
