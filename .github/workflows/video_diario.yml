name: "Publicación Automática Constante Día, Tarde y Noche (Veo + 2D Fallback → Facebook + YouTube)"

on:
  schedule:
    # 1. Mañana 1: 8:00 AM Ciudad de México (14:00 UTC)
    - cron: "0 14 * * *"
    # 2. Mañana 2: 11:30 AM Ciudad de México (17:30 UTC)
    - cron: "30 17 * * *"
    # 3. Tarde 1: 3:00 PM Ciudad de México (21:00 UTC)
    - cron: "0 21 * * *"
    # 4. Tarde 2: 6:00 PM Ciudad de México (00:00 UTC)
    - cron: "0 0 * * *"
    # 5. Noche 1: 9:00 PM Ciudad de México (03:00 UTC)
    - cron: "0 3 * * *"
    # 6. Noche 2: 11:30 PM Ciudad de México (05:30 UTC)
    - cron: "30 5 * * *"

  # Control manual desde la app de GitHub en tu Xiaomi Redmi Note 10S
  workflow_dispatch:
    inputs:
      topic:
        description: 'Tema (deja "auto" para usar episodios en rotación)'
        required: false
        default: "auto"
      format:
        description: 'Formato: "auto" (80% videos), "video", "photo" o "text"'
        required: false
        default: "video"
      use_veo:
        description: 'Usar Google Veo para clips cinemáticos? (true/false)'
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  publicar-multired:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # ─── Gemini / Veo API ────────────────────────────────────────────
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # ─── Facebook ───────────────────────────────────────────────────
      FB_EMAIL: ${{ secrets.FB_EMAIL }}
      FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
      FB_COOKIES_B64: ${{ secrets.FB_COOKIES_B64 }}
      FB_PAGE_NAME: ""
      # ─── YouTube Shorts ─────────────────────────────────────────────
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      # ─── ElevenLabs TTS ─────────────────────────────────────────────
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del sistema (fuentes y ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation fonts-dejavu-core ffmpeg imagemagick

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar y publicar en Facebook + YouTube Shorts
        run: |
          TOPIC="${{ github.event.inputs.topic || 'auto' }}"
          FORMAT="${{ github.event.inputs.format || 'auto' }}"
          USE_VEO="${{ github.event.inputs.use_veo || 'true' }}"

          # Construir flags adicionales
          FLAGS="--topic \"$TOPIC\" --format \"$FORMAT\" --headless"
          if [ "$USE_VEO" = "false" ]; then
            FLAGS="$FLAGS --no-veo"
          fi

          eval "python -u main.py $FLAGS"

      - name: Auditar métricas de monetización en vivo
        if: always()
        run: |
          python monetization_tracker.py || true

      - name: Guardar historial de publicaciones (sin conflictos de merge)
        if: always()
        run: |
          git config user.name "FB-YT Creator Bot"
          git config user.email "bot@users.noreply.github.com"

          # Guardar archivos modificados en temp
          cp banco_guiones.txt /tmp/banco_guiones.txt 2>/dev/null || true
          cp output/published_scripts.json /tmp/published_scripts.json 2>/dev/null || true
          cp output/viral_history.json /tmp/viral_history.json 2>/dev/null || true
          cp output/published_topics.json /tmp/published_topics.json 2>/dev/null || true
          cp output/published_formats.json /tmp/published_formats.json 2>/dev/null || true
          cp output/voice_ab_history.json /tmp/voice_ab_history.json 2>/dev/null || true
          cp output/youtube_upload_history.json /tmp/youtube_upload_history.json 2>/dev/null || true
          cp output/monetization_status.json /tmp/monetization_status.json 2>/dev/null || true
          cp output/editorial_history.json /tmp/editorial_history.json 2>/dev/null || true

          # Sincronizar con remote y restaurar
          git checkout -- .
          git pull --rebase origin main

          cp /tmp/banco_guiones.txt banco_guiones.txt 2>/dev/null || true
          cp /tmp/published_scripts.json output/published_scripts.json 2>/dev/null || true
          cp /tmp/viral_history.json output/viral_history.json 2>/dev/null || true
          cp /tmp/published_topics.json output/published_topics.json 2>/dev/null || true
          cp /tmp/published_formats.json output/published_formats.json 2>/dev/null || true
          cp /tmp/voice_ab_history.json output/voice_ab_history.json 2>/dev/null || true
          cp /tmp/youtube_upload_history.json output/youtube_upload_history.json 2>/dev/null || true
          cp /tmp/monetization_status.json output/monetization_status.json 2>/dev/null || true

          git add \
            banco_guiones.txt \
            output/published_scripts.json \
            output/viral_history.json \
            output/published_topics.json \
            output/published_formats.json \
            output/voice_ab_history.json \
            output/youtube_upload_history.json \
            output/monetization_status.json \
            output/editorial_history.json \
            2>/dev/null || true

          git diff --staged --quiet || git commit -m "Actualizar historial y progreso monetizacion [skip ci]"
          git push origin main || true
