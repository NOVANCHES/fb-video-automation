name: Publicación Automática Constante Día, Tarde y Noche (Videos Largos 2D y Postales)

on:
  schedule:
    # 1. DÍA (Mañana 1): 8:00 AM hora Ciudad de México (14:00 UTC)
    - cron: '0 14 * * *'
    # 2. DÍA (Mañana 2): 11:30 AM hora Ciudad de México (17:30 UTC)
    - cron: '30 17 * * *'
    # 3. TARDE (Tarde 1): 3:00 PM hora Ciudad de México (21:00 UTC)
    - cron: '0 21 * * *'
    # 4. TARDE (Tarde 2): 6:00 PM hora Ciudad de México (00:00 UTC)
    - cron: '0 0 * * *'
    # 5. NOCHE (Noche 1): 9:00 PM hora Ciudad de México (03:00 UTC)
    - cron: '0 3 * * *'
    # 6. NOCHE (Noche 2): 11:30 PM hora Ciudad de México (05:30 UTC)
    - cron: '30 5 * * *'

  # Control manual desde la app de GitHub en tu Xiaomi Redmi Note 10S
  workflow_dispatch:
    inputs:
      topic:
        description: 'Tema (deja "auto" para usar episodios largos en rotación)'
        required: false
        default: 'auto'
      format:
        description: 'Formato: "auto" (80% videos largos animados 2D), "video", "photo" o "text"'
        required: false
        default: 'video'

permissions:
  contents: write

jobs:
  publicar-contenido-facebook:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (Gemini, Edge-TTS, MoviePy, Selenium)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar y publicar (Video Largo 2D con pregunta o Postal Temática)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_EMAIL: ${{ secrets.FB_EMAIL }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
          FB_COOKIES_B64: ${{ secrets.FB_COOKIES_B64 }}
          FB_PAGE_NAME: ""
        run: |
          python -u main.py --topic "${{ github.event.inputs.topic || 'auto' }}" --format "${{ github.event.inputs.format || 'auto' }}" --headless

      - name: Guardar historial de temas y formatos publicados sin conflictos
        run: |
          git config user.name "FB Creator Bot"
          git config user.email "bot@users.noreply.github.com"
          Copy-Item output/published_topics.json $env:TEMP/published_topics.json -Force -ErrorAction SilentlyContinue
          Copy-Item output/published_formats.json $env:TEMP/published_formats.json -Force -ErrorAction SilentlyContinue
          git checkout -- .
          git pull --rebase origin main
          Copy-Item $env:TEMP/published_topics.json output/published_topics.json -Force -ErrorAction SilentlyContinue
          Copy-Item $env:TEMP/published_formats.json output/published_formats.json -Force -ErrorAction SilentlyContinue
          git add output/published_topics.json output/published_formats.json
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Actualizar historial de publicaciones"
            git push origin main
          }
