name: Publicación Automática Constante Día, Tarde y Noche (Videos, Fotos y Textos)

on:
  schedule:
    # 1. DÍA (Mañana 1): 8:00 AM hora Ciudad de México (14:00 UTC)
    - cron: '0 14 * * *'
    # 2. DÍA (Mañana 2): 11:30 AM hora Ciudad de México (17:30 UTC)
    - cron: '30 17 * * *'
    # 3. TARDE (Tarde 1): 3:00 PM hora Ciudad de México (21:00 UTC)
    - cron: '0 21 * * *'
    # 4. TARDE (Tarde 2): 6:00 PM hora Ciudad de México (00:00 UTC)
    - cron: '0 0 * * *'
    # 5. NOCHE (Noche 1): 9:00 PM hora Ciudad de México (03:00 UTC)
    - cron: '0 3 * * *'
    # 6. NOCHE (Noche 2): 11:30 PM hora Ciudad de México (05:30 UTC)
    - cron: '30 5 * * *'

  # Control manual desde la app de GitHub en tu Xiaomi Redmi Note 10S
  workflow_dispatch:
    inputs:
      topic:
        description: 'Tema (deja "auto" para usar tendencias del momento)'
        required: false
        default: 'auto'
      format:
        description: 'Formato: "auto" (rota entre video, foto y texto), "video", "photo" o "text"'
        required: false
        default: 'auto'

permissions:
  contents: write

jobs:
  publicar-contenido-facebook:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (Gemini, Edge-TTS, MoviePy, Selenium)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar y publicar (Video con pregunta, Foto con historia o Texto de debate)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_EMAIL: ${{ secrets.FB_EMAIL }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
          FB_COOKIES_B64: ${{ secrets.FB_COOKIES_B64 }}
          FB_PAGE_NAME: ""
        run: |
          python -u main.py --topic "${{ github.event.inputs.topic || 'auto' }}" --format "${{ github.event.inputs.format || 'auto' }}" --headless

      - name: Guardar historial de temas y formatos publicados
        run: |
          git config user.name "FB Creator Bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/published_topics.json output/published_formats.json
          git diff --staged --quiet || (git commit -m "Actualizar historial de publicaciones (Día/Tarde/Noche)" && git pull --rebase origin main && git push)
