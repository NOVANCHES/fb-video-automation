name: "Video Diario Gaming - Facebook Reels"

on:
  schedule:
    # 8:00 AM Mexico (14:00 UTC)
    - cron: "0 14 * * *"
    # 12:00 PM Mexico (18:00 UTC)
    - cron: "0 18 * * *"
    # 4:00 PM Mexico (22:00 UTC)
    - cron: "0 22 * * *"
    # 9:00 PM Mexico (03:00 UTC)
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      topic:
        description: "Tema especifico (auto = rotacion automatica)"
        required: false
        default: "auto"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FB_EMAIL: ${{ secrets.FB_EMAIL }}
      FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
      FB_COOKIES_B64: ${{ secrets.FB_COOKIES_B64 }}
      FB_PAGE_NAME: ""
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation fonts-dejavu-core ffmpeg imagemagick \
            chromium-browser chromium-chromedriver xvfb

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mostrar historial actual
        run: |
          echo "=== gaming_history.json ==="
          cat output/gaming_history.json 2>/dev/null || echo "[]"
          echo "=== image_hashes_history.json ==="
          cat output/image_hashes_history.json 2>/dev/null | python3 -c "import json,sys; h=json.load(sys.stdin); print(f'{len(h)} hashes registrados')" 2>/dev/null || echo "0 hashes"

      - name: Generar y publicar video
        run: |
          TOPIC="${{ github.event.inputs.topic || 'auto' }}"
          python -u main.py --topic "$TOPIC" --format video --headless

      - name: Guardar historial en repositorio
        if: always()
        run: |
          git config user.name "Gaming Bot"
          git config user.email "bot@users.noreply.github.com"

          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            # Restaurar historiales generados en este run (guardados en /tmp por main.py)
            cp /tmp/gaming_history_run.json output/gaming_history.json 2>/dev/null || true
            cp /tmp/image_hashes_run.json output/image_hashes_history.json 2>/dev/null || true
            cp /tmp/published_formats_run.json output/published_formats.json 2>/dev/null || true
            cp /tmp/monetization_run.json output/monetization_status.json 2>/dev/null || true
            cp /tmp/banco_guiones_run.txt banco_guiones.txt 2>/dev/null || true

            git add \
              output/gaming_history.json \
              output/image_hashes_history.json \
              output/published_formats.json \
              output/monetization_status.json \
              banco_guiones.txt \
              2>/dev/null || true

            git diff --staged --quiet && echo "Sin cambios." && break

            git commit -m "bot: actualiza historial post-publicacion [skip ci]" && \
            git push origin main && break || \
            echo "Reintento $i..." && sleep 5
          done
